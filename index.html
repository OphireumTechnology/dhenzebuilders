    <!-- Suppress third-party browser extension noise (e.g. MetaMask, Web3 wallet extension connection errors in sandboxed iframes) -->
    <script>
      (function () {
        function shouldSuppress(errOrMsg) {
          if (!errOrMsg) return false;
          var text = '';
          if (typeof errOrMsg === 'string') {
            text = errOrMsg;
          } else if (errOrMsg.message) {
            text = errOrMsg.message + ' ' + (errOrMsg.stack || '');
          } else if (errOrMsg.reason) {
            text = (errOrMsg.reason.message || errOrMsg.reason.toString()) + ' ' + (errOrMsg.reason.stack || '');
          } else {
            text = String(errOrMsg);
          }
          var lower = text.toLowerCase();
          return (
            lower.indexOf('metamask') !== -1 ||
            lower.indexOf('failed to connect to metamask') !== -1 ||
            lower.indexOf('ethereum') !== -1 ||
            lower.indexOf('evmprovider') !== -1 ||
            lower.indexOf('chrome-extension://') !== -1 ||
            lower.indexOf('moz-extension://') !== -1 ||
            lower.indexOf('inpage.js') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (e) {
            if (shouldSuppress(e.error || e.message)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (shouldSuppress(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
