<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" fill="none">
  <defs>
    <linearGradient id="pledgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F"/>
      <stop offset="60%" stop-color="#051322"/>
      <stop offset="100%" stop-color="#020B14"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D082"/>
      <stop offset="35%" stop-color="#C6922D"/>
      <stop offset="70%" stop-color="#E5B95D"/>
      <stop offset="100%" stop-color="#8F6317"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#223E63"/>
      <stop offset="100%" stop-color="#0A1C30"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background with subtle technical blueprint grid -->
  <rect width="900" height="1300" fill="url(#pledgeBg)"/>
  <rect width="900" height="1300" fill="url(#gridPattern)"/>

  <!-- Architectural Gold Double Framing -->
  <rect x="25" y="25" width="850" height="1250" rx="6" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.85"/>
  <rect x="33" y="33" width="834" height="1234" rx="4" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Ornamental Corner Accents -->
  <g fill="url(#goldGradient)">
    <!-- Top-Left Corner Rosette -->
    <path d="M 25 50 L 50 25 L 42 25 L 25 42 Z"/>
    <circle cx="44" cy="44" r="3"/>
    <!-- Top-Right Corner Rosette -->
    <path d="M 875 50 L 850 25 L 858 25 L 875 42 Z"/>
    <circle cx="856" cy="44" r="3"/>
    <!-- Bottom-Left Corner Rosette -->
    <path d="M 25 1250 L 50 1275 L 42 1275 L 25 1258 Z"/>
    <circle cx="44" cy="1256" r="3"/>
    <!-- Bottom-Right Corner Rosette -->
    <path d="M 875 1250 L 850 1275 L 858 1275 L 875 1258 Z"/>
    <circle cx="856" cy="1256" r="3"/>
  </g>

  <!-- Top Institutional Header -->
  <g transform="translate(450, 75)" text-anchor="middle">
    <!-- Emblem Monogram Crest -->
    <circle cx="0" cy="18" r="30" fill="url(#goldBadge)" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <path d="M -12 28 L -6 28 L -6 14 L 6 14 L 6 8 L -12 8 Z" fill="url(#goldGradient)"/>
    <path d="M 0 5 L 8 5 C 14 5 18 10 18 18 C 18 26 14 31 0 31 Z M 5 10 L 5 26 L 8 26 C 12 26 14 22 14 18 C 14 14 12 10 8 10 Z" fill="#E5B95D"/>

    <text y="70" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="700" fill="#E5B95D" letter-spacing="0.28em">
      REPUBLIC OF THE PHILIPPINES • DTI REG. NO. 4812272 • PSIC 42900
    </text>
    <text y="98" font-family="'Montserrat', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.12em">
      LDL DHENZE RESIDENTIAL BUILDING CONSTRUCTION
    </text>
    <text y="122" font-family="'Montserrat', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" letter-spacing="0.22em">
      BUILDING TODAY • ENGINEERING TOMORROW • POWERING THE FUTURE
    </text>

    <!-- Header Divider Line -->
    <line x1="-360" y1="140" x2="360" y2="140" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="0" cy="140" r="3.5" fill="url(#goldGradient)"/>
  </g>

  <!-- Title Banner -->
  <g transform="translate(450, 255)" text-anchor="middle">
    <rect x="-240" y="-22" width="480" height="40" rx="4" fill="#0E2849" stroke="url(#goldGradient)" stroke-width="1"/>
    <text y="4" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F8FAFC" letter-spacing="0.24em">
      FOUNDER’S MESSAGE &amp; SOLEMN PLEDGE
    </text>
  </g>

  <!-- Executive Profile Card & Formal Portrait Frame -->
  <g transform="translate(70, 305)">
    <!-- Frame Box -->
    <rect width="760" height="150" rx="8" fill="#081E36" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Stylized Executive Cameo / Silhouette Frame -->
    <rect x="20" y="15" width="95" height="120" rx="6" fill="#040D17" stroke="url(#goldGradient)" stroke-width="1.2"/>
    <!-- Stylized Architectural Portrait Icon -->
    <g transform="translate(67, 65)">
      <circle cx="0" cy="-12" r="16" fill="url(#goldGradient)" fill-opacity="0.85"/>
      <path d="M -22 28 C -22 14 -12 8 0 8 C 12 8 22 14 22 28 Z" fill="url(#goldGradient)" fill-opacity="0.85"/>
    </g>

    <!-- Executive Title & Distinction -->
    <text x="135" y="42" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">
      LEODENIS “DHENZE” LANGUISAN
    </text>
    <text x="135" y="65" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#E5B95D" letter-spacing="0.05em">
      Founder, President and Chief Executive Officer
    </text>
    <text x="135" y="85" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#CBD5E1">
      Bachelor of Commerce (Major in Banking &amp; Finance) • Bachelor of Science in Information Technology
    </text>
    <text x="135" y="103" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="400" fill="#94A3B8">
      Two decades spanning JPMorgan Chase operations, construction management, and corporate leadership
    </text>

    <!-- Executive Office Badge -->
    <rect x="135" y="115" width="460" height="22" rx="3" fill="#0E2A4D"/>
    <text x="145" y="130" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" fill="#38BDF8">
      Executive Office: KMC | One West Aeropark, Clark Freeport Zone, Pampanga • +63 917 966 8814
    </text>
  </g>

  <!-- Authoritative Message Body (Word-for-Word Approved Text) -->
  <g transform="translate(70, 485)">
    <!-- Salutation -->
    <text x="0" y="24" font-family="'Cinzel', Georgia, serif" font-size="16" font-style="italic" font-weight="700" fill="#F8FAFC">
      To Our Clients, Partners, and Future Generations:
    </text>

    <!-- Paragraph 1 -->
    <text x="0" y="60" font-family="'Playfair Display', Georgia, serif" font-size="14.5" line-height="24" fill="#FFFFFF">
      <tspan x="0" dy="0">“When we build, we do not merely raise structures. We build opportunities. We build progress.</tspan>
      <tspan x="0" dy="24">We build legacies. And above all, we build trust.”</tspan>
    </text>

    <!-- Paragraph 2 -->
    <text x="0" y="125" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#CBD5E1" font-weight="400">
      <tspan x="0" dy="0">At LDL Dhenze Residential Building Construction, our mission is clear: to lawfully deliver world-class</tspan>
      <tspan x="0" dy="21">infrastructure and integrated solutions that improve lives and strengthen the nation—today, tomorrow,</tspan>
      <tspan x="0" dy="21">and for generations to come.</tspan>
    </text>

    <!-- Paragraph 3 -->
    <text x="0" y="205" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#CBD5E1" font-weight="400">
      <tspan x="0" dy="0">Our commitment is anchored on integrity that never compromises, quality that never fails, and innovation</tspan>
      <tspan x="0" dy="21">that creates lasting value. We embrace technology, renewable energy, and Artificial Intelligence as tools</tspan>
      <tspan x="0" dy="21">to design smarter, build stronger, and operate more responsibly.</tspan>
    </text>

    <!-- Paragraph 4 -->
    <text x="0" y="285" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#CBD5E1" font-weight="400">
      <tspan x="0" dy="0">We understand that every project we undertake carries public trust and a legal responsibility. That is why</tspan>
      <tspan x="0" dy="21">we strictly comply with all applicable laws, codes, and regulatory standards of the Republic of the Philippines.</tspan>
      <tspan x="0" dy="21">We build with discipline. We manage with transparency. We deliver with honor.</tspan>
    </text>
  </g>

  <!-- Gratitude & Closing -->
  <g transform="translate(70, 825)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="url(#goldGradient)" stroke-width="0.75" stroke-opacity="0.4"/>
    <text x="0" y="28" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8">
      To our team—thank you for your dedication.  •  To our partners—thank you for your confidence.  •  To our clients—thank you for allowing us to be part of your vision.
    </text>
    <text x="0" y="55" font-family="'Cinzel', Georgia, serif" font-size="13.5" font-weight="700" fill="#E5B95D">
      Together, let us continue building a better Philippines—stronger, smarter, and more sustainable.
    </text>
  </g>

  <!-- The 4 Pledge Pillars in Boxes -->
  <g transform="translate(70, 905)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="180" height="70" rx="4" fill="#081E36" stroke="url(#goldGradient)" stroke-width="0.75"/>
    <text x="90" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">COMPLIANT BY LAW</text>
    <text x="90" y="46" font-family="'Montserrat', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">All codes &amp; statutory rules</text>

    <!-- Pillar 2 -->
    <rect x="193" y="0" width="180" height="70" rx="4" fill="#081E36" stroke="url(#goldGradient)" stroke-width="0.75"/>
    <text x="283" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ETHICAL BY CHOICE</text>
    <text x="283" y="46" font-family="'Montserrat', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Right even when unwatched</text>

    <!-- Pillar 3 -->
    <rect x="386" y="0" width="180" height="70" rx="4" fill="#081E36" stroke="url(#goldGradient)" stroke-width="0.75"/>
    <text x="476" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">STRONGER TOGETHER</text>
    <text x="476" y="46" font-family="'Montserrat', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Collaborative shared success</text>

    <!-- Pillar 4 -->
    <rect x="580" y="0" width="180" height="70" rx="4" fill="#081E36" stroke="url(#goldGradient)" stroke-width="0.75"/>
    <text x="670" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUILDING THE NATION</text>
    <text x="670" y="46" font-family="'Montserrat', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Enduring sustainable value</text>
  </g>

  <!-- Core Values Ribbon -->
  <g transform="translate(450, 1000)" text-anchor="middle">
    <rect x="-380" y="-14" width="760" height="28" rx="3" fill="#051527" stroke="url(#goldGradient)" stroke-width="0.5"/>
    <text y="4" font-family="'Cinzel', serif" font-size="10.5" font-weight="700" fill="#E5B95D" letter-spacing="0.14em">
      INTEGRITY  •  QUALITY  •  INNOVATION  •  SAFETY  •  SUSTAINABILITY  •  ACCOUNTABILITY  •  PARTNERSHIP
    </text>
  </g>

  <!-- Solemn Pledge Highlight Callout -->
  <g transform="translate(70, 1030)">
    <rect width="760" height="85" rx="6" fill="#0B233F" stroke="url(#goldGradient)" stroke-width="1.2"/>
    <text x="380" y="28" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#E5B95D" text-anchor="middle" letter-spacing="0.18em">
      OUR SOLEMN CORPORATE PLEDGE
    </text>
    <text x="380" y="52" font-family="'Playfair Display', Georgia, serif" font-size="13" font-style="italic" fill="#FFFFFF" text-anchor="middle">
      “We pledge to uphold the highest standards of professionalism, safety, and environmental stewardship,
    </text>
    <text x="380" y="70" font-family="'Playfair Display', Georgia, serif" font-size="13" font-style="italic" fill="#FFFFFF" text-anchor="middle">
      to empower communities, and to create value that endures beyond our time.”
    </text>
  </g>

  <!-- Signature Block & Formal Corporate Seal -->
  <g transform="translate(70, 1135)">
    <!-- Gold Foil Notarial / Corporate Seal -->
    <g transform="translate(70, 45)">
      <circle cx="0" cy="0" r="38" fill="url(#goldBadge)" stroke="url(#goldGradient)" stroke-width="2"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" stroke-dasharray="3,2"/>
      <text y="-8" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#E5B95D" text-anchor="middle">LDL DHENZE</text>
      <text y="3" font-family="'Cinzel', serif" font-size="6" font-weight="700" fill="#FFFFFF" text-anchor="middle">OFFICIAL SEAL</text>
      <text y="14" font-family="'Cinzel', serif" font-size="5" font-weight="700" fill="#CBD5E1" text-anchor="middle">2023 - 2028</text>
    </g>

    <!-- Sign-off Block -->
    <g transform="translate(480, 10)">
      <!-- Handwritten style signature path -->
      <path d="M 30 25 Q 70 5 110 20 T 170 15 Q 190 30 210 18" fill="none" stroke="#E5B95D" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="35" x2="260" y2="35" stroke="#CBD5E1" stroke-width="1"/>
      <text x="135" y="52" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        LEODENIS DEVEZA LANGUISAN
      </text>
      <text x="135" y="68" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="600" fill="#C6922D" text-anchor="middle">
        Founder, President and Chief Executive Officer
      </text>
    </g>
  </g>

  <!-- Bottom Regulatory Disclaimer -->
  <g transform="translate(450, 1250)" text-anchor="middle">
    <text y="0" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="400" fill="#64748B">
      DTI BN No. 4812272 (Validity 2023–2028) • BIR Form 2303 OCN 21ARC2025000002189 • PSIC 42900 Civil Engineering
    </text>
    <text y="14" font-family="'Montserrat', sans-serif" font-size="8" font-weight="400" fill="#475569">
      All engineering, architectural, and construction services conform strictly to RA 9266, PRC standards, and applicable Philippine laws.
    </text>
  </g>
</svg>
