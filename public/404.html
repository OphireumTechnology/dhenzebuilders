<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LDL Dhenze Residential Building Construction</title>
    <script>
      // GitHub Pages SPA redirect: converts direct subpath request to hash route
      (function() {
        var path = window.location.pathname.replace(/^\//, '');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (path) {
          window.location.replace('/#' + path + search + hash);
        } else {
          window.location.replace('/' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background-color: #071A2F; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to LDL Dhenze portal...</p>
  </body>
</html>
